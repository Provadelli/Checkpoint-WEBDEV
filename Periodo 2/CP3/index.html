<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificando DOM</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Modificação de imagens</h1>

    <div>
        <button onclick="changeImage()">Trocar Imagem</button>
        <img src="/Periodo 2/CP3/imagem1.webp" alt="imagem gitHub" id="myImage">
    </div>


    <script>
        //getAttribute - obter valor do atributo (valor da linha)
        //setAttribute - definir ou modificar o valor da linha

        function changeImage() {
            const img = document.getElementById("myImage");
            const coletarSrc = img.getAttribute("src");

            if (coletarSrc === "imagem1.webp") {
                img.setAttribute("src", "imagem2.webp");
                img.setAttribute("alt", "Segunda img ");
            } else { 
                img.setAttribute("src", "imagem1.webp")
                img.setAttribute("alt", "Primeira img ");
            }
        }
    </script>
</body>

</html>
